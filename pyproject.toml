[project]
name = "model-comparison-tracker"
version = "0.1.0"
description = "Run one question set against Azure OpenAI and a local Ollama model, and track accuracy, latency and cost in MLflow."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mlflow>=2.17"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
